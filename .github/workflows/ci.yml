name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run so `npm audit` surfaces newly-published advisories against
  # unchanged code — most dependency CVEs land long after the last commit.
  schedule:
    - cron: "0 9 * * 1"

# A new push to a PR makes the in-flight run obsolete; don't burn minutes on it.
# Pushes to main are never cancelled: Vercel deploys every main commit, so each
# one should end with its own CI verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, build & e2e
    # The weekly run exists for `npm audit`; the code itself hasn't changed.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their OS libraries come baked into the image, so there's no
    # browser cache or `playwright install-deps` (apt) on the critical path —
    # that step once stalled for 11 minutes on a slow mirror. The tag MUST match
    # @playwright/test in package-lock.json; the check below fails fast if not.
    # --user 1001 matches the runner's uid so the workspace stays writable.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check Playwright image matches @playwright/test
        run: |
          node -e '
            const fs = require("fs");
            const { chromium } = require("@playwright/test");
            const v = require("@playwright/test/package.json").version;
            if (!fs.existsSync(chromium.executablePath())) {
              console.error(`::error::The Playwright container image does not match @playwright/test ${v}. Set the verify job image to mcr.microsoft.com/playwright:v${v}-noble.`);
              process.exit(1);
            }
            console.log(`Playwright ${v}: browsers present`);
          '

      - run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - run: npm run build

      # Covers smoke, responsive, seo and a11y (axe-core) across both projects.
      # On CI, playwright.config.ts serves the build above via `next start`.
      - run: npm run test:e2e

      # Only on failure: a green run's report is noise, and this is the one
      # moment the traces (trace: on-first-retry) are worth keeping.
      # `test-results/` holds those traces; `playwright-report/` is the viewer.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  lighthouse:
    name: Lighthouse budget
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # lh-gate.mjs expects a *production* server on :3000 — dev-mode numbers
      # are meaningless for a performance budget.
      - name: Start production server
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server failed to start within 60s"; exit 1

      - run: npm run test:lh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Production dependencies are what actually ship. Dev-only advisories
      # (build tooling, test harnesses) shouldn't block a PR.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (advisory only)
        run: npm audit || true
