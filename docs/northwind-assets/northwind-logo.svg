<svg width="520" height="128" viewBox="0 0 520 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Northwind logo — a cyan triangle-mark tile beside the Northwind wordmark">
  <!-- Northwind horizontal lockup: mark + wordmark.
       Mark: Cyan #22D3EE tile, up/down triangles in Ink #0B1B3A (lower one dimmed).
       Wordmark: "Northwind" in Sora 700, Ink #0B1B3A.
       NOTE: references the Sora font by name; embed/convert-to-outlines in Figma
       if Sora is not installed. Keep in sync with
       public/work/northwind/Logo — Export Ready.svg. -->
  <!-- mark tile (96×96, rounded) -->
  <rect x="8" y="16" width="96" height="96" rx="24" fill="#22D3EE"/>
  <g transform="translate(8 16) scale(3)">
    <path d="M16 6.5L20.1136 13.625H11.8864L16 6.5Z" fill="#0B1B3A"/>
    <path opacity="0.4" d="M16 25.5L11.8864 18.375H20.1136L16 25.5Z" fill="#0B1B3A"/>
  </g>
  <!-- wordmark -->
  <text x="128" y="80" fill="#0B1B3A" font-family="Sora, sans-serif" font-size="60" font-weight="700" letter-spacing="-2">Northwind</text>
</svg>
