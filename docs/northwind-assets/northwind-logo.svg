<svg width="520" height="128" viewBox="0 0 520 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Northwind logo — a compass-needle mark beside the Northwind wordmark">
  <!-- Northwind horizontal lockup: mark + wordmark.
       Mark: Cobalt #2563EB tile, needle Paper #FFFFFF with a Coral #FB6F5B north half.
       Wordmark: "Northwind" in Sora 700, Ink #0B1B3A.
       NOTE: this references the Sora font by name; embed/convert-to-outlines in Figma
       if Sora is not installed. -->
  <!-- mark tile (96×96, rounded) -->
  <rect x="8" y="16" width="96" height="96" rx="27" fill="#2563EB"/>
  <g transform="translate(56 64)">
    <path d="M 0 -30 L 18 22 L 0 -3 L -18 22 Z" fill="#FFFFFF"/>
    <path d="M 0 -30 L 18 22 L 0 -3 Z" fill="#FB6F5B"/>
  </g>
  <!-- wordmark -->
  <text x="128" y="80" fill="#0B1B3A" font-family="Sora, sans-serif" font-size="60" font-weight="700" letter-spacing="-2">Northwind</text>
</svg>
